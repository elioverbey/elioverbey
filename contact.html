---
layout: default
title: Get in Touch
meta_description: Get in touch with Eli Overbey.
permalink: /contact/
---

<section class="hero">
    <h1>Get in Touch</h1>
    <p class="contact-intro">Have a question or just want to say hi? Drop me a note and I'll get back to you.</p>
</section>

<section class="content-section">
    <form class="contact-form" id="contact-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p id="form-status" class="form-status"></p>
    </form>

    <div class="social-links">
        <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://x.com/{{ site.twitter }}" target="_blank" rel="noopener">X (Twitter)</a>
    </div>
</section>

<script>
(function() {
  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var data = new FormData(form);
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    status.textContent = '';
    status.className = 'form-status';

    fetch('https://formspree.io/f/{{ site.formspree_id }}', {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(function(res) {
      if (res.ok) {
        form.reset();
        status.textContent = 'Thanks! I\'ll get back to you soon.';
        status.className = 'form-status form-success';
      } else {
        status.textContent = 'Something went wrong. Please try again.';
        status.className = 'form-status form-error';
      }
      btn.disabled = false;
      btn.textContent = 'Send Message';
    }).catch(function() {
      status.textContent = 'Something went wrong. Please try again.';
      status.className = 'form-status form-error';
      btn.disabled = false;
      btn.textContent = 'Send Message';
    });
  });
})();
</script>
