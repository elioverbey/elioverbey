---
layout: default
---

<article>
    <a class="back-link" href="/writing/">&larr; Back to writing</a>

    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
            <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
            {% if page.categories.size > 0 %}
                &middot; {{ page.categories | array_to_sentence_string }}
            {% endif %}
        </div>
    </header>

    <section class="post-content">
        {{ content }}
    </section>

    <footer class="post-footer">
        <div class="author-section">
            <img class="author-avatar" src="/assets/images/profile.png" alt="{{ site.author }}">
            <div class="author-info">
                <h4>{{ site.author }}</h4>
                <p>{{ site.tagline }}</p>
            </div>
        </div>

        {% include share.html %}
    </footer>
</article>
