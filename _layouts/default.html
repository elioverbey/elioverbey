<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — {{ site.name }}</title>
    <meta name="description" content="{{ page.meta_description | default: site.description }}">
    <link rel="shortcut icon" href="/waving.ico" type="image/x-icon">
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
</head>
<body>
    <header>
        {% include nav.html %}
    </header>

    <div class="site-wrapper">
        {{ content }}
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; {{ "now" | date: "%Y" }} {{ site.name }}</span>
            <div class="footer-links">
                <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://x.com/{{ site.twitter }}" target="_blank" rel="noopener">X</a>
                <button id="theme-toggle" class="theme-toggle">Lights off</button>
            </div>
        </div>
    </footer>

    <script src="/assets/js/theme-toggle.js"></script>
</body>
</html>
